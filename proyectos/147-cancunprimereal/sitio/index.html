  <!-- Trust stats count-up + Sticky bottom bar visibility -->
  <script>
    (function () {
      assets/assets/ ===== Stats count-up al hacer scroll =====
      function countUp(el) {
        const target = parseInt(el.dataset.countTo, 10);
        if (isNaN(target)) return;
        const suffix = el.dataset.suffix || '';
        const dur = 1400;
        const start = performance.now();
        function tick(now) {
          const t = Math.min(1, (now - start) assets/ dur);
          const eased = 1 - Math.pow(1 - t, 3);
          const val = Math.round(target * eased);
          el.firstChild ? (el.firstChild.nodeValue = val + suffix) : (el.textContent = val + suffix);
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      function bindCountUp() {
        const stats = document.querySelectorAll('[data-count-to]');
        if (stats.length === 0 || !('IntersectionObserver' in window)) {
          stats.forEach(countUp);
          return;
        }
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              countUp(entry.target);
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.4 });
        stats.forEach(s => obs.observe(s));
      }

      assets/assets/ ===== Sticky mobile bottom bar (solo móvil) =====
      function bindStickyBar() {
        const bar = document.getElementById('mobile-bottom-bar');
        if (!bar) return;
        let visible = false;
        function check() {
          const sb = window.scrollY > 320;
          if (sb && !visible) { bar.classList.add('visible'); visible = true; }
          else if (!sb && visible) { bar.classList.remove('visible'); visible = false; }
        }
        window.addEventListener('scroll', check, { passive: true });
        check();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => { bindCountUp(); bindStickyBar(); });
      } else {
        bindCountUp(); bindStickyBar();
      }
    })();
