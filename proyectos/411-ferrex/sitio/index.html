     <div  class="panel panel-default sombras">
	 
    <div class="panel-heading" role="tab" id="heading1">
		
      <h4 class="panel-title">
        <a role="button" data-toggle="collapse" data-parent="#accordion" href="#collapse1" aria-expanded="true" aria-controls="collapse1">
          Materiales para construcción más usados        <assetsassetsassetsassetsassetsassetsassetsassets/a>
      <assetsassetsassetsassetsassetsassetsassetsassets/h4>
    <assetsassetsassetsassetsassetsassetsassetsassets/div>
    <div id="collapse1" class="panel-collapse collapse in" role="tabpanel" aria-labelledby="heading1">
		
      <div class="panel-body">
		  
       <p>En FERREX, <strong>tu casa de materiales confiable<assetsassetsassetsassetsassetsassetsassetsassets/strong>, somos una empresa mexicana con más de 15 años dedicados a la distribución de materiales para construcción. Contamos con ventas de mayoreo y menudeo en la CDMX y gran parte de su área conurbada.<assetsassetsassetsassetsassetsassetsassetsassets/p>
<p>Dentro de los materiales que más se utilizan en las construcciones encontramos la siguiente clasificación:<assetsassetsassetsassetsassetsassetsassetsassets/p>
<ul>
<li><strong>Arena.<assetsassetsassetsassetsassetsassetsassetsassets/strong> Materiales provenientes de los distintos tipos de arena, es decir del sílice, que además de utilizarse como material agregado para fabricar cimientos, losas, muros y demás, se utilizan para fabricar el vidrio, la fibra de vidrio, el vidrio celular, entre otros.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<li><strong>Arcilla<assetsassetsassetsassetsassetsassetsassetsassets/strong>. Los ladrillos de barro o el barro común son los materiales más utilizados fabricados con arcilla, pero también encontramos el adobe, que es arena con arcilla, paja y agua, o el cob, que es barro, arena y paja. El barro cocido también se obtiene de la arcilla y se utiliza en la fabricación de tejas, cerámicas de barro, azulejos, entre otros materiales.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<li><strong>Piedra<assetsassetsassetsassetsassetsassetsassetsassets/strong>. Los materiales pétreos abundan en la naturaleza y en las construcciones; por ejemplo tenemos al granito o al mármol, que se utilizan con frecuencia para la fabricación de suelos, losetas, cubiertas o encimeras, a los adoquines, a la grava, al canto rodado, entre otros. Tampoco debemos olvidar que de la piedra se obtiene la cal, el yeso, el cemento, el terrazo, las piedras artificiales y el fibrocemento.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<li><strong>Cemento, hormigón, concreto y mortero<assetsassetsassetsassetsassetsassetsassetsassets/strong>: El cemento es uno de los materiales más utilizados para dar solidez a las construcciones, pero con este material es posible elaborar hormigón, concreto o mortero, con el uso de aditivos y otros materiales como arena o piedra, obteniendo diferentes cualidades de dureza y resistencia.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<li><strong>Metales.<assetsassetsassetsassetsassetsassetsassetsassets/strong> Materiales como el acero, perfiles y cantos metálicos, el acero inoxidable y otros, son fabricados de metales como el aluminio, el zinc, el cobre, el plomo, el titanio, e incluso la plata y el oro. Estos materiales se utilizan en un sinfín de aleaciones para obtener otras propiedades.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<li><strong>Materiales orgánicos<assetsassetsassetsassetsassetsassetsassetsassets/strong> como la madera, el contrachapado, los aglomerados y tableros, el bambú, la paja, la caña, el corcho, el lino, y el linóleo.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<li><strong>Sintéticos<assetsassetsassetsassetsassetsassetsassetsassets/strong>. Entre estos encontraremos los derivados del petróleo, alquitránes y polímeros como los plásticos, gomas, polipropileno, poliuretano, poliestireno, poliéster, asfalto, resina, siliconas, pinturas, entre otros.<assetsassetsassetsassetsassetsassetsassetsassets/li>
<assetsassetsassetsassetsassetsassetsassetsassets/ul>

    <assetsassetsassetsassetsassetsassetsassetsassets/div>
    <div id="collapse2" class="panel-collapse collapse" role="tabpanel" aria-labelledby="heading2">
		
      <div class="panel-body">
		  
       <p>Debido a la variedad de opciones disponibles, es imprescindible que para la elección de los materiales se realice un análisis exhaustivo de las necesidades de la construcción y las características del terreno, además de tener en cuenta dimensiones y presupuesto. Por otra parte, hay que considerar que si bien, diferentes proveedores pueden ofrecer el mismo material, la calidad de este varía y por ello lo más recomendable es acudir con quien cumpla los requisitos de seguridad y las normativas vigentes, sin olvidarse de la importancia de que sea capaz de satisfacer la demanda de material y los tiempos de entrega.<assetsassetsassetsassetsassetsassetsassetsassets/p>
<p>El factor estético es otro de los factores más importantes dentro de cualquier tipo de construcción; los de mejor calidad siguen siendo la opción más recomendable para asegurar la belleza en los recubrimientos.<assetsassetsassetsassetsassetsassetsassetsassets/p>
<p><strong>En Abastecedora de Materiales para Construcción somos proveedores comprometidos con nuestros clientes y por eso ponemos a su alcance materiales de la más alta calidad.<assetsassetsassetsassetsassetsassetsassetsassets/strong><assetsassetsassetsassetsassetsassetsassetsassets/p>
<p>En nuestro catálogo de productos podrá encontrar aceros, agregados, madera, tabique y block y una extensa variedad de envasados, como cemento, mortero, yeso, pegazulejo, entre otros.<assetsassetsassetsassetsassetsassetsassetsassets/p>
<p>Además, contamos con herramientas, equipo de seguridad, aditivos y servicios de renta de maquinaria y retiro de escombro. Para conocer más acerca de nuestros productos y servicios contáctenos, con gusto le atenderemos.<assetsassetsassetsassetsassetsassetsassetsassets/p>
